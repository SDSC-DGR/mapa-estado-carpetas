<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Municipios declarados en desastre · Estado de carpetas · GAD Santa Cruz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:light;--ink:#18261e;--mute:#5a6b61;--line:#d6ded9;--g:#1e6b3a;--bg:#f3f6f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;background:#fff;border-bottom:3px solid var(--g)}
.top img{height:32px;width:auto;display:block}
#hero{position:relative;height:calc(100dvh - 59px - env(safe-area-inset-top,0px));min-height:460px}
#map{position:absolute;inset:0;background:#e6ece8}
.card,.lg{position:absolute;z-index:500;background:rgba(255,255,255,.96);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.card{top:10px;left:10px;width:min(350px,calc(100% - 70px));padding:10px 12px}
.card h1{font-size:1rem;line-height:1.25;margin:0;color:var(--g)}
.card .sub{font-size:.78rem;color:var(--mute);margin:2px 0 6px}
.corte{display:inline-block;font-size:.74rem;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.card details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.card summary{cursor:pointer;font-weight:650;font-size:.86rem}
.card dl{margin:6px 0 0;font-size:.8rem}
.card dt{color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;margin-top:5px}
.card dd{margin:0}
.lg{left:10px;bottom:24px;padding:6px 10px;font-size:.78rem}
.lg summary{cursor:pointer;font-weight:650}
.lg button{all:unset;display:flex;gap:7px;align-items:center;width:100%;padding:3px 0;cursor:pointer;box-sizing:border-box}
.lg button[aria-pressed=true]{font-weight:700;text-decoration:underline}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.3);flex:none}
.lg small{display:block;color:var(--mute);margin-top:3px;font-size:.68rem}
.lbl{background:none;border:0;box-shadow:none;font-weight:650;font-size:.68rem;color:#0f2a1a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;padding:0}
.lbl:before{display:none}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:.84rem;line-height:1.4;margin:10px 12px}
.leaflet-popup-content b{font-size:.95rem}
.b{display:inline-flex;gap:5px;align-items:center;font-size:.78rem;font-weight:650;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;white-space:nowrap}
.b i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.3)}
#tabla{max-width:1180px;margin:0 auto;padding:22px 14px 8px}
#tabla h2{font-size:1.05rem;margin:0 0 10px;color:var(--g)}
.fil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fil input,.fil select{font:inherit;font-size:.88rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0;flex:1 1 160px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:.84rem}
th{background:var(--g);color:#fff;text-align:left;padding:8px 10px;font-weight:650;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td button{all:unset;cursor:pointer;font-weight:650;color:var(--g);text-decoration:underline}
td button:focus-visible,summary:focus-visible,.lg button:focus-visible{outline:2px solid #e07f10;outline-offset:2px}
.vacio{padding:16px;color:var(--mute);background:#fff;border:1px solid var(--line)}
footer{max-width:1180px;margin:0 auto;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 22px);font-size:.78rem;color:var(--mute)}
footer p{margin:2px 0}
@media(max-width:819px){
 table,tbody,tr,td{display:block}thead{display:none}
 tr{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 10px}
 td{border:0;padding:4px 0;display:grid;grid-template-columns:104px 1fr;gap:8px}
 td:before{content:attr(data-l);color:var(--mute);font-size:.72rem;text-transform:uppercase}
 table{border:0;background:none}
}
</style>
</head>
<body>
<header class="top">
  <img src="img/logo_gad.png" alt="Gobierno Autónomo Departamental de Santa Cruz">
  <img src="img/logo_dgr.png" alt="Dirección de Gestión de Riesgos">
</header>

<section id="hero">
  <div id="map" role="img" aria-label="Mapa de los 56 municipios de Santa Cruz según el estado de su carpeta"></div>
  <div class="card" id="card">
    <h1 id="t"></h1>
    <p class="sub" id="st"></p>
    <span class="corte" id="corte"></span>
    <details id="dec"><summary id="decn"></summary><dl id="decd"></dl></details>
  </div>
  <details class="lg" id="lg" open><summary>Estado de carpeta</summary><div id="lgi"></div><small id="lgn"></small></details>
</section>

<section id="tabla">
  <h2>Municipios declarados en desastre</h2>
  <div class="fil">
    <input id="q" type="search" placeholder="Buscar municipio" aria-label="Buscar municipio">
    <select id="fp" aria-label="Filtrar por provincia"><option value="">Todas las provincias</option></select>
  </div>
  <div id="tb"></div>
</section>

<footer>
  <p><b>Fuente:</b> Área EDAN - DGR</p>
  <p><b>Elaboración:</b> Unidad de Análisis de Información de Riesgos y Emergencia - DGR</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== CONFIGURACIÓN: edite solo este bloque ===== */
const CONFIG = {
  titulo: "Municipios Declarados en desastre - Estado de carpetas",
  subtitulo: "Gobierno Autónomo Departamental de Santa Cruz - DGR",
  corte: "26-10-2026",                       // fecha de corte de la información
  decreto: {
    numero: "Decreto Departamental N° 548/2026",
    fecha: "28 / sep / 2026",
    vigencia: "30 / dic / 2026",
    venceISO: "2026-12-30",                  // para calcular los días restantes
    objeto: "Declaratoria de Emergencia Departamental por Variaciones Climáticas y Múltiples Eventos Adversos.",
    norma: "Ley N° 602 de Gestión de Riesgos y DS N° 2342, art. 63 (documentación de respaldo)"
  },
  geojson: "data/municipios.geojson",
  csv_url: "",                               // enlace CSV publicado de Google Sheets (vacío = usa data/estado.csv)
  csv_local: "data/estado.csv"
};

/* ===== ESTADOS ===== */
const ES = {
  orden: {t: "En orden",         c: "#2e9e5b", i: "✔"},
  obs:   {t: "Observada",        c: "#d64545", i: "✖"},
  proc:  {t: "En proceso",       c: "#f0902b", i: "◐"},
  sin:   {t: "Sin declaratoria", c: "#c3cfc6", i: "–"}
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
const clave = v => { v = norm(v); return v.startsWith("en orden") ? "orden" : v.startsWith("observ") ? "obs" : v.startsWith("en proc") ? "proc" : "sin"; };
const badge = k => `<span class="b"><i style="background:${ES[k].c}"></i>${ES[k].i} ${ES[k].t}</span>`;

function parseCSV(txt){
  const rows = []; let r = [], f = "", q = false;
  txt = txt.replace(/^\uFEFF/, "");
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { r.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && txt[i+1] === "\n") i++; r.push(f); f = ""; rows.push(r); r = []; }
    else f += ch;
  }
  if (f || r.length){ r.push(f); rows.push(r); }
  const h = rows.shift().map(x => x.trim().toUpperCase());
  return rows.filter(x => x.some(Boolean)).map(x => Object.fromEntries(h.map((k, i) => [k, (x[i] || "").trim()])));
}
async function cargarCSV(){
  for (const u of [CONFIG.csv_url, CONFIG.csv_local].filter(Boolean)){
    try { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"}); if (r.ok) return parseCSV(await r.text()); } catch (e) {}
  }
  return [];
}

/* ===== ENCABEZADO Y DECRETO ===== */
const D = CONFIG.decreto;
$("t").textContent = CONFIG.titulo; $("st").textContent = CONFIG.subtitulo;
$("corte").textContent = "Corte de información: " + CONFIG.corte;
const dias = Math.ceil((new Date(D.venceISO + "T23:59:59") - new Date()) / 864e5);
$("decn").textContent = D.numero;
$("decd").innerHTML = `<dt>Fecha</dt><dd>${esc(D.fecha)}</dd>
  <dt>Vigencia</dt><dd>Hasta el ${esc(D.vigencia)} · ${dias >= 0 ? "quedan " + dias + " días" : "vencido"}</dd>
  <dt>Objeto</dt><dd>${esc(D.objeto)}</dd><dt>Norma</dt><dd>${esc(D.norma)}</dd>`;
if (innerWidth >= 820) $("dec").open = true; else $("lg").open = false;

/* ===== MAPA ===== */
const map = L.map("map", {zoomControl: false, attributionControl: true});
L.control.zoom({position: "topright"}).addTo(map);
const base = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {maxZoom: 14, attribution: "Tiles © Esri"}).addTo(map);
let fallos = 0;   // si la base gris falla, pasa a OpenStreetMap
base.on("tileerror", () => { if (++fallos === 6){ map.removeLayer(base); L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 14, attribution: "© OpenStreetMap contributors"}).addTo(map); } });
["card", "lg"].forEach(id => { L.DomEvent.disableClickPropagation($(id)); L.DomEvent.disableScrollPropagation($(id)); });

const F = {est: null, prov: "", q: ""};
let capas = [];
const visible = m => (!F.est || m.k === F.est) && (!F.prov || m.prov === F.prov) && (!F.q || norm(m.mun).includes(norm(F.q)));

function estilo(m){
  const dec = m.k !== "sin", on = visible(m);
  return {color: dec ? "#16301f" : "#8a9a8f", weight: dec ? 1.5 : .6, fillColor: ES[m.k].c, fillOpacity: !on ? .1 : dec ? .88 : .6, opacity: on ? 1 : .35};
}
function popup(m){
  const e = m.d || {};
  return `<b>${esc(m.mun)}</b><br>${esc(m.prov)}<br>${badge(m.k)}` + (m.k === "sin" ? "" :
    `<br><b style="font-size:.8rem">Evento:</b> ${esc(e.EVENTO_ADVERSO || "—")}<br><b style="font-size:.8rem">Norma:</b> ${esc(e.LEY_DECRETO_FECHA || "—")}<br><b style="font-size:.8rem">Vigencia:</b> ${esc(e.VIGENCIA || "—")}<br><b style="font-size:.8rem">Ingreso DGR:</b> ${esc(e.FECHA_INGRESO_DGR || "—")}` +
    (e.OBSERVACION ? `<br><i>${esc(e.OBSERVACION)}</i>` : ""));
}

function pintar(){
  capas.forEach(m => m.l.setStyle(estilo(m)));
  const n = {orden: 0, obs: 0, proc: 0, sin: 0}; capas.forEach(m => n[m.k]++);
  $("lgi").innerHTML = Object.keys(ES).map(k => `<button data-k="${k}" aria-pressed="${F.est === k}"><span class="sw" style="background:${ES[k].c}"></span>${ES[k].i} ${ES[k].t} (${n[k]})</button>`).join("");
  $("lgn").textContent = F.est ? "Toque de nuevo para quitar el filtro" : `${capas.length - n.sin} de ${capas.length} municipios declarados`;
  $("lgi").querySelectorAll("button").forEach(b => b.onclick = () => { F.est = F.est === b.dataset.k ? null : b.dataset.k; pintar(); });
  const v = capas.filter(m => m.k !== "sin" && visible(m)).sort((a, b) => a.prov.localeCompare(b.prov, "es") || a.mun.localeCompare(b.mun, "es"));
  $("tb").innerHTML = !v.length ? `<div class="vacio">No hay municipios declarados con los filtros actuales.</div>` :
    `<table><thead><tr><th>Provincia</th><th>Municipio</th><th>Estado de carpeta</th><th>Evento adverso</th><th>Ley o decreto y fecha de promulgación</th><th>Vigencia</th><th>Fecha de ingreso (DGR)</th></tr></thead><tbody>` +
    v.map(m => { const e = m.d || {}; return `<tr><td data-l="Provincia">${esc(m.prov)}</td><td data-l="Municipio"><button data-c="${m.cod}">${esc(m.mun)}</button></td><td data-l="Estado">${badge(m.k)}</td><td data-l="Evento">${esc(e.EVENTO_ADVERSO || "—")}</td><td data-l="Ley o decreto">${esc(e.LEY_DECRETO_FECHA || "—")}</td><td data-l="Vigencia">${esc(e.VIGENCIA || "—")}</td><td data-l="Ingreso DGR">${esc(e.FECHA_INGRESO_DGR || "—")}</td></tr>`; }).join("") + `</tbody></table>`;
  $("tb").querySelectorAll("button").forEach(b => b.onclick = () => {
    const m = capas.find(x => x.cod === b.dataset.c); $("hero").scrollIntoView();
    map.fitBounds(m.l.getBounds(), {maxZoom: 10, padding: [40, 40]}); m.l.openPopup();
  });
}

Promise.all([fetch(CONFIG.geojson).then(r => { if (!r.ok) throw 0; return r.json(); }), cargarCSV()]).then(([gj, datos]) => {
  const por = {}; datos.forEach(d => por[String(d.COD_INE).padStart(6, "0")] = d);
  L.geoJSON(gj, {
    style: {weight: .6},
    onEachFeature: (f, l) => {
      const p = f.properties, d = por[p.COD_INE], m = {cod: p.COD_INE, mun: p.MUNICIPIO, prov: p.PROVINCIA, d, k: clave(d && d.ESTADO), l};
      capas.push(m); l.bindPopup(() => popup(m), {maxWidth: 270});
      if (m.k !== "sin") l.bindTooltip(esc(m.mun), {permanent: true, direction: "center", className: "lbl"});
    }
  }).addTo(map);
  map.fitBounds(L.featureGroup(capas.map(m => m.l)).getBounds(), {padding: [10, 10]});
  [...new Set(capas.map(m => m.prov))].sort((a, b) => a.localeCompare(b, "es")).forEach(p => $("fp").add(new Option(p, p)));
  $("fp").onchange = e => { F.prov = e.target.value; pintar(); };
  $("q").oninput = e => { F.q = e.target.value; pintar(); };
  pintar();
}).catch(() => {
  $("tb").innerHTML = `<div class="vacio">No se pudo cargar ${esc(CONFIG.geojson)}. Publique el sitio por HTTP (GitHub Pages) y no abra el archivo directamente.</div>`;
  map.setView([-17.8, -61.5], 6);
});
</script>
</body>
</html>
